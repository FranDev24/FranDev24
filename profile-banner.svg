<svg viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0F2027"/>
      <stop offset="50%" stop-color="#2C5364"/>
      <stop offset="100%" stop-color="#00C6FF"/>
    </linearGradient>
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00C6FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00C6FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#bfe9ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="blurBig" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <linearGradient id="glassFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <clipPath id="clipCanvas">
      <rect x="0" y="0" width="900" height="220"/>
    </clipPath>
    <clipPath id="clipGlass">
      <rect x="120" y="45" width="660" height="130" rx="24"/>
    </clipPath>
  </defs>

  <!-- fondo -->
  <rect width="900" height="220" fill="url(#bg)"/>

  <!-- orbes de luz difuminados -->
  <g clip-path="url(#clipCanvas)">
    <circle cx="150" cy="40" r="120" fill="url(#orb1)" filter="url(#blurBig)"/>
    <circle cx="780" cy="200" r="150" fill="url(#orb1)" filter="url(#blurBig)"/>
  </g>

  <!-- panel de vidrio esmerilado -->
  <rect x="120" y="45" width="660" height="130" rx="24" fill="url(#glassFill)" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.2"/>

  <!-- brillo/reflejo que se desliza sobre el vidrio -->
  <g clip-path="url(#clipGlass)">
    <rect x="-200" y="45" width="120" height="130" fill="#ffffff" opacity="0.14" transform="skewX(-20)">
      <animate attributeName="x" from="-250" to="900" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- texto principal con leve shine -->
  <text x="450" y="112" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="40" font-weight="700" fill="url(#textShine)">Franchesco Benavides</text>

  <!-- subtítulo -->
  <text x="450" y="145" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="16" font-weight="500" fill="#d7f3ff" opacity="0.9">Developer | Ingeniero de Software | Tecnólogo en Radiología</text>
</svg>
